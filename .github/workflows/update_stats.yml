name: Update Hantavirus Stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas requests feedparser

      - name: Run stats parser
        run: python parser/parser.py

      - name: Run news parser
        run: python parser/news_parser.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stats.json data/news.json
          git diff --staged --quiet || git commit -m "chore: update stats and news [skip ci]"
          git push

      - name: Trigger Bot Webhook
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        if: env.WEBHOOK_URL != ''
        run: |
          curl -X POST "${WEBHOOK_URL}/webhook/update" \
          -H "X-Webhook-Secret: ${WEBHOOK_SECRET}" \
          -H "Content-Type: application/json"