name: Hantavirus Auto Update

on:
  schedule:
    - cron: '0 * * * *' # Раз в час
  workflow_dispatch: # Позволяет запускать вручную

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas requests

      - name: Run Parser
        run: python parser/parser.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/stats.json
          # Проверяем, есть ли изменения, чтобы не сыпать ошибками если данных нет
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update stats" && git push)