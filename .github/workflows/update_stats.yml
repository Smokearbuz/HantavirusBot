name: Update Hantavirus Stats

on:
  schedule:
    - cron: "0 */6 * * *"   # каждые 6 часов
  workflow_dispatch:          # ручной запуск из GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas requests

      - name: Run parser
        run: python parser/parser.py

      - name: Commit updated stats.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stats.json
          git diff --staged --quiet || git commit -m "chore: update stats.json [skip ci]"
          git push

      - name: Notify backend (trigger push notifications)
        run: |
          curl -s -X POST "${{ secrets.API_URL }}/webhook/update" \
            -H "X-Webhook-Secret: ${{ secrets.WEBHOOK_SECRET }}" \
            --fail || echo "⚠️ Webhook вернул ошибку (бот мог быть не запущен)"