<!DOCTYPE html>
<html lang="ru">
<head>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HantaTracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* Telegram Theme Variables with Fallbacks */
    --bg-color: var(--tg-theme-bg-color, #ffffff);
    --secondary-bg-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
    --text-color: var(--tg-theme-text-color, #000000);
    --hint-color: var(--tg-theme-hint-color, #707579);
    --link-color: var(--tg-theme-link-color, #2481cc);
    --button-color: var(--tg-theme-button-color, #2481cc);
    --button-text-color: var(--tg-theme-button-text-color, #ffffff);
    
    /* App Specific Colors (Calm Palette) */
    --accent-blue: #007aff;
    --accent-red: #ff3b30;
    --accent-orange: #ff9500;
    --accent-green: #34c759;
    --surface: var(--bg-color);
    --card-bg: var(--secondary-bg-color);
    --border: rgba(0,0,0,0.08);
    
    --sans: 'Inter', sans-serif;
    --mono: 'Space Mono', monospace;
  }

  [data-theme="dark"] {
    --border: rgba(255,255,255,0.08);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg-color);
    color: var(--text-color);
    font-family: var(--sans);
    line-height: 1.5;
    user-select: none;
    transition: background 0.3s, color 0.3s;
  }

  .app {
    max-width: 500px;
    margin: 0 auto;
    padding-bottom: 80px;
  }

  /* Typography */
  h1, h2, h3 { font-weight: 700; }
  .label { font-size: 11px; font-weight: 600; color: var(--hint-color); text-transform: uppercase; letter-spacing: 0.5px; }

  /* Header */
  .header {
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    background: var(--bg-color);
    z-index: 100;
    border-bottom: 1px solid var(--border);
  }
  .header-title { font-size: 19px; font-weight: 800; }
  .header-title span { color: var(--accent-red); }
  .status-badge {
    padding: 4px 10px;
    border-radius: 20px;
    background: rgba(52, 199, 89, 0.1);
    color: var(--accent-green);
    font-size: 11px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .dot { width: 6px; height: 6px; background: currentColor; border-radius: 50%; }

  /* Cards */
  .section { padding: 20px 20px 10px; }
  .card {
    background: var(--secondary-bg-color);
    border-radius: 16px;
    padding: 16px;
    margin: 0 20px;
    border: 1px solid var(--border);
  }
  
  /* Global Stats */
  .main-stat {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .main-val { font-size: 42px; font-weight: 800; letter-spacing: -1px; }
  .sub-val { font-size: 12px; color: var(--hint-color); }
  
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .stat-box {
    padding: 12px 8px;
    background: var(--bg-color);
    border-radius: 12px;
    text-align: center;
    border: 1px solid var(--border);
  }
  .stat-box-val { font-size: 16px; font-weight: 700; font-family: var(--mono); }
  .stat-box-label { font-size: 9px; color: var(--hint-color); text-transform: uppercase; margin-top: 2px; }

  /* Risk Meter */
  .risk-card { margin-top: 12px; }
  .risk-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
  .risk-bar { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
  .risk-fill { height: 100%; width: 0; border-radius: 4px; transition: width 1s ease; background: var(--accent-green); }

  /* Demographics */
  .demo-row { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
  .demo-label { font-size: 12px; font-weight: 600; width: 60px; }
  .demo-track { flex: 1; height: 16px; background: var(--border); border-radius: 8px; overflow: hidden; position: relative; }
  .demo-fill { height: 100%; background: var(--link-color); transition: width 0.8s ease; }
  .demo-val { position: absolute; right: 8px; top: 0; line-height: 16px; font-size: 10px; font-weight: 700; color: var(--text-color); }

  /* List Items */
  .list-container { margin-top: 10px; display: flex; flex-direction: column; gap: 1px; background: var(--border); }
  .list-item {
    background: var(--bg-color);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    cursor: pointer;
  }
  .list-item:active { background: var(--secondary-bg-color); }
  .item-flag { font-size: 24px; width: 32px; text-align: center; }
  .item-body { flex: 1; }
  .item-name { font-size: 15px; font-weight: 600; }
  .item-hint { font-size: 12px; color: var(--hint-color); }
  .item-right { text-align: right; }
  .item-val { font-size: 16px; font-weight: 700; font-family: var(--mono); }
  .item-delta { font-size: 11px; font-weight: 600; color: var(--accent-red); }

  /* Tabs */
  .tab-bar { display: flex; padding: 10px 20px; gap: 8px; overflow-x: auto; scrollbar-width: none; }
  .tab-bar::-webkit-scrollbar { display: none; }
  .tab-item {
    padding: 6px 14px;
    background: var(--secondary-bg-color);
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    color: var(--hint-color);
    white-space: nowrap;
    border: 1px solid var(--border);
  }
  .tab-item.active { background: var(--button-color); color: var(--button-text-color); border-color: var(--button-color); }

  /* Bottom Nav */
  .bottom-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 60px;
    background: var(--bg-color);
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding-bottom: env(safe-area-inset-bottom);
    z-index: 1000;
  }
  .nav-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    color: var(--hint-color);
    font-size: 10px;
    font-weight: 600;
    cursor: pointer;
    flex: 1;
  }
  .nav-btn svg { width: 22px; height: 22px; fill: currentColor; }
  .nav-btn.active { color: var(--button-color); }

  /* Search */
  .search-wrap { padding: 0 20px 10px; }
  .search-input {
    width: 100%;
    background: var(--secondary-bg-color);
    border: none;
    padding: 10px 16px;
    border-radius: 12px;
    font-family: inherit;
    font-size: 15px;
    color: var(--text-color);
    outline: none;
  }

  /* Pages */
  .page { display: none; }
  .page.active { display: block; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  /* Detail Page */
  .detail-hero { padding: 30px 20px; text-align: center; }
  .detail-flag { font-size: 64px; margin-bottom: 8px; }
  .detail-name { font-size: 28px; font-weight: 800; }
  
  .back-btn {
    position: absolute; top: 16px; left: 20px;
    width: 32px; height: 32px;
    background: var(--secondary-bg-color);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }

  /* News */
  .news-card {
    background: var(--bg-color);
    margin: 0 20px 12px;
    padding: 16px;
    border-radius: 16px;
    border: 1px solid var(--border);
  }
  .news-meta { font-size: 10px; font-weight: 700; color: var(--link-color); text-transform: uppercase; margin-bottom: 4px; }
  .news-title { font-size: 15px; font-weight: 600; line-height: 1.4; margin-bottom: 8px; }
  .news-footer { font-size: 11px; color: var(--hint-color); }

  /* Utility */
  .mt-12 { margin-top: 12px; }
  .mb-12 { margin-bottom: 12px; }
  .hidden { display: none; }
</style>
</head>
<body>

<div class="app">
  
  <!-- PAGE: GLOBAL -->
  <div class="page active" id="page-global">
    <div class="header">
      <div class="header-title">Hanta<span>Tracker</span></div>
      <div class="status-badge"><div class="dot"></div> LIVE</div>
    </div>

    <div class="section">
      <div class="label mb-12">Глобальный обзор</div>
      <div class="card">
        <div class="main-stat">
          <div>
            <div class="main-val" id="gTotal">0</div>
            <div class="sub-val">Всего случаев</div>
          </div>
          <div style="text-align: right;">
            <div class="item-delta" id="gDelta">+0</div>
            <div class="sub-val">за 24ч</div>
          </div>
        </div>
        <div class="stats-grid">
          <div class="stat-box">
            <div class="stat-box-val" style="color: var(--accent-red)" id="gConfirmed">0</div>
            <div class="stat-box-label">Подтв.</div>
          </div>
          <div class="stat-box">
            <div class="stat-box-val" style="color: var(--accent-orange)" id="gCFR">0%</div>
            <div class="stat-box-label">CFR</div>
          </div>
          <div class="stat-box">
            <div class="stat-box-val" style="color: var(--accent-green)" id="gDeaths">0</div>
            <div class="stat-box-label">Смертей</div>
          </div>
        </div>
      </div>
      
      <!-- Risk Meter -->
      <div class="card risk-card">
        <div class="risk-header">
          <div class="label" style="text-transform: none;">Риск по оценке WHO</div>
          <div id="riskLabel" style="font-size: 12px; font-weight: 700; color: var(--accent-orange);">MODERATE</div>
        </div>
        <div class="risk-bar">
          <div class="risk-fill" id="riskFill"></div>
        </div>
      </div>
    </div>

    <div class="section" style="padding-bottom: 0;">
      <div class="label">Демография</div>
      <div class="card mt-12">
        <div class="demo-row">
          <div class="demo-label">М / Ж</div>
          <div class="demo-track">
            <div class="demo-fill" id="genderFill" style="background: var(--accent-blue);"></div>
            <div class="demo-val" id="genderVal">50 / 50</div>
          </div>
        </div>
        <div class="demo-row">
          <div class="demo-label">46+ лет</div>
          <div class="demo-track">
            <div class="demo-fill" id="ageFill" style="background: var(--accent-orange);"></div>
            <div class="demo-val" id="ageVal">0%</div>
          </div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="label mb-12">Список стран</div>
      <div class="search-wrap" style="padding: 0; margin-bottom: 12px;">
        <input type="text" class="search-input" placeholder="Поиск страны..." id="searchInput" oninput="filterCountries()">
      </div>
      <div class="tab-bar">
        <div class="tab-item active">Все</div>
        <div class="tab-item">Хотспоты</div>
        <div class="tab-item">Латинская Америка</div>
      </div>
    </div>

    <div class="list-container" id="countryList">
      <!-- Generated by JS -->
    </div>
  </div>

  <!-- PAGE: NEWS -->
  <div class="page" id="page-news">
    <div class="header">
      <div class="header-title">Новости</div>
      <div class="status-badge">UPDATE</div>
    </div>
    <div class="section" id="newsList">
      <!-- Generated by JS -->
    </div>
  </div>

  <!-- PAGE: DETAIL -->
  <div class="page" id="page-detail">
    <div class="back-btn" onclick="showPage('global')">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
    </div>
    <div class="detail-hero">
      <div class="detail-flag" id="dFlag">🏳️</div>
      <div class="detail-name" id="dName">Страна</div>
      <div class="item-delta" id="dHotspot" style="margin-top: 4px;">HOTSPOT 📈</div>
    </div>
    
    <div class="card">
      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-box-val" id="dTotal">0</div>
          <div class="stat-box-label">Всего</div>
        </div>
        <div class="stat-box">
          <div class="stat-box-val" id="dNew">+0</div>
          <div class="stat-box-label">За 7д</div>
        </div>
        <div class="stat-box">
          <div class="stat-box-val" id="dDeath">0</div>
          <div class="stat-box-label">Умерло</div>
        </div>
      </div>
    </div>
    
    <div class="section">
      <button class="add-country-btn" style="width: 100%; padding: 14px; background: var(--button-color); color: var(--button-text-color); border: none; border-radius: 14px; font-weight: 700;" id="subBtn" onclick="toggleSub()">🔔 Подписаться на обновления</button>
    </div>
  </div>

</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <div class="nav-btn active" onclick="showPage('global')">
    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
    Обзор
  </div>
  <div class="nav-btn" onclick="showPage('news')">
    <svg viewBox="0 0 24 24"><path d="M20 3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-1 16H5V5h14v14zM8 15h8v2H8v-2zm0-4h8v2H8v-2zm0-4h8v2H8V7z"/></svg>
    Новости
  </div>
  <div class="nav-btn" onclick="tg.showAlert('Раздел в разработке')">
    <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
    Алерты
  </div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

// Настройка цветов темы
// ═══════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════
const API_BASE = '/api'; // Прокси через Cloudflare Functions

let countries = [];
let subscriptions = new Set();

async function init() {
  try {
    const res = await fetch(API_BASE + '/stats');
    const data = await res.json();
    
    // Global Stats
    document.getElementById('gTotal').textContent = data.global.total;
    document.getElementById('gConfirmed').textContent = data.global.confirmed;
    document.getElementById('gDeaths').textContent = data.global.deaths;
    document.getElementById('gCFR').textContent = data.global.cfr + '%';
    document.getElementById('gDelta').textContent = '+' + data.global.new_24h;
    
    // Risk Meter
    const risk = data.global.risk_level;
    const riskFill = document.getElementById('riskFill');
    const riskLabel = document.getElementById('riskLabel');
    riskLabel.textContent = risk.toUpperCase();
    if (risk === 'Low') {
      riskFill.style.width = '20%';
      riskFill.style.background = 'var(--accent-green)';
    } else if (risk === 'Moderate') {
      riskFill.style.width = '55%';
      riskFill.style.background = 'var(--accent-orange)';
    } else {
      riskFill.style.width = '90%';
      riskFill.style.background = 'var(--accent-red)';
    }
    
    // Demographics
    const male = data.global.demographics.gender.male;
    const female = data.global.demographics.gender.female;
    const total = male + female || 1;
    document.getElementById('genderFill').style.width = (male/total*100) + '%';
    document.getElementById('genderVal').textContent = `${male} м / ${female} ж`;
    
    const age46 = data.global.demographics.age["46-65"] + data.global.demographics.age["66+"];
    const ageTotal = data.global.total || 1;
    document.getElementById('ageFill').style.width = (age46/ageTotal*100) + '%';
    document.getElementById('ageVal').textContent = Math.round(age46/ageTotal*100) + '%';
    
    countries = data.countries;
    renderCountries(countries);
    
    loadNews();
  } catch (e) {
    console.error(e);
  }
}

function renderCountries(list) {
  const container = document.getElementById('countryList');
  container.innerHTML = list.map(c => `
    <div class="list-item" onclick="showDetail('${c.iso}')">
      <div class="item-flag">${c.flag}</div>
      <div class="item-body">
        <div class="item-name">${c.name}</div>
        <div class="item-hint">${c.deaths} умерло · ${c.growth}% рост</div>
      </div>
      <div class="item-right">
        <div class="item-val">${c.total}</div>
        ${c.new_7d > 0 ? `<div class="item-delta">+${c.new_7d}</div>` : ''}
      </div>
    </div>
  `).join('');
}

async function loadNews() {
  try {
    const res = await fetch(API_BASE + '/news');
    const data = await res.json();
    const list = document.getElementById('newsList');
    list.innerHTML = data.articles.map(a => `
      <div class="news-card" onclick="tg.openLink('${a.url}')">
        <div class="news-meta">${a.source_name} · ${a.published}</div>
        <div class="news-title">${a.title}</div>
        <div class="news-footer">${a.country} · ${a.lang}</div>
      </div>
    `).join('');
  } catch (e) {}
}

function showDetail(iso) {
  const c = countries.find(x => x.iso === iso);
  currentCountry = c;
  document.getElementById('dFlag').textContent = c.flag;
  document.getElementById('dName').textContent = c.name;
  document.getElementById('dTotal').textContent = c.total;
  document.getElementById('dNew').textContent = '+' + c.new_7d;
  document.getElementById('dDeath').textContent = c.deaths;
  
  // Хотспот на основе роста
  const isHot = c.growth > 10 || (countries.indexOf(c) < 3 && c.growth > 0);
  document.getElementById('dHotspot').classList.toggle('hidden', !isHot);
  
  const isSubbed = subscriptions.has(iso);
  const btn = document.getElementById('subBtn');
  btn.textContent = isSubbed ? '✅ Вы подписаны' : '🔔 Подписаться на обновления';
  btn.style.background = isSubbed ? 'var(--secondary-bg-color)' : 'var(--button-color)';
  btn.style.color = isSubbed ? 'var(--text-color)' : 'var(--button-text-color)';

  showPage('detail');
}

function toggleSub() {
  const iso = currentCountry.iso;
  const isSubbed = subscriptions.has(iso);
  if (isSubbed) {
    subscriptions.delete(iso);
    tg.sendData(JSON.stringify({action: 'unsubscribe', iso: iso, country_name: currentCountry.name}));
  } else {
    subscriptions.add(iso);
    tg.sendData(JSON.stringify({action: 'subscribe', iso: iso, country_name: currentCountry.name}));
  }
  showDetail(iso);
}

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active');
  
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  if (id === 'global') document.querySelectorAll('.nav-btn')[0].classList.add('active');
  if (id === 'news') document.querySelectorAll('.nav-btn')[1].classList.add('active');
  
  window.scrollTo(0,0);
}

function filterCountries() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  renderCountries(countries.filter(c => c.name.toLowerCase().includes(q)));
}

init();
</script>
</body>
</html>
